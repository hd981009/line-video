<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>YouTube → LINE 轉換工具</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; }
    .box { margin-top: 20px; word-break: break-all; background:#f5f5f5; padding:10px; }
  </style>
</head>
<body>

<h2>YouTube → LINE 穩定縮圖工具</h2>

<input id="yt" placeholder="貼上 YouTube 連結" />
<button onclick="gen()">產生 LINE 連結</button>

<div class="box" id="out"></div>

<script>
function getId(url){
  const m = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function gen(){
  const url = document.getElementById("yt").value;
  const id = getId(url);

  if(!id){
    document.getElementById("out").innerHTML = "無法解析 YouTube";
    return;
  }

  const page = `${location.origin}${location.pathname}og.html?id=${id}`;

  document.getElementById("out").innerHTML = `
    <b>LINE 請貼這個：</b><br><br>
    ${page}<br><br>
    <button onclick="navigator.clipboard.writeText('${page}')">複製</button>
  `;
}
</script>

</body>
</html>
